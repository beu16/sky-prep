<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D59" />
      <stop offset="50%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#051326" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE279" />
      <stop offset="40%" stop-color="#F2B134" />
      <stop offset="100%" stop-color="#D98A16" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2E86FF" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />

  <!-- Aviator Shield Background -->
  <path d="M256 70 C340 70, 400 110, 400 190 C400 310, 310 390, 256 430 C202 390, 112 310, 112 190 C112 110, 172 70, 256 70 Z" 
        fill="#081C36" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Aviator Wings -->
  <!-- Left Wing -->
  <path d="M256 220 L130 180 C110 200, 100 230, 140 250 L256 260 Z" fill="url(#goldGrad)" opacity="0.9" />
  <path d="M256 240 L150 220 C140 235, 135 250, 165 265 L256 270 Z" fill="url(#goldGrad)" opacity="0.75" />
  <path d="M256 260 L180 250 C175 260, 170 270, 195 280 L256 280 Z" fill="url(#goldGrad)" opacity="0.6" />

  <!-- Right Wing -->
  <path d="M256 220 L382 180 C402 200, 412 230, 372 250 L256 260 Z" fill="url(#goldGrad)" opacity="0.9" />
  <path d="M256 240 L362 220 C372 235, 377 250, 347 265 L256 270 Z" fill="url(#goldGrad)" opacity="0.75" />
  <path d="M256 260 L332 250 C337 260, 342 270, 317 280 L256 280 Z" fill="url(#goldGrad)" opacity="0.6" />

  <!-- Jet Airliner Climbing -->
  <g transform="translate(0, -10)">
    <!-- Fuselage -->
    <path d="M256 120 C264 120, 270 145, 270 200 L272 280 L320 320 L320 335 L272 315 L272 370 L288 388 L288 400 L256 392 L224 400 L224 388 L240 370 L240 315 L192 335 L192 320 L240 280 L242 200 C242 145, 248 120, 256 120 Z" 
          fill="#FFFFFF" filter="url(#glow)" />
    <!-- Wing Highlights -->
    <polygon points="256,150 268,260 256,275 244,260" fill="url(#goldGrad)" />
    <!-- Cockpit Window -->
    <ellipse cx="256" cy="165" rx="5" ry="8" fill="#0B2545" />
  </g>

  <!-- Star Emblems -->
  <polygon points="256,330 260,342 273,342 263,350 267,362 256,354 245,362 249,350 239,342 252,342" fill="#F2B134" />
</svg>
